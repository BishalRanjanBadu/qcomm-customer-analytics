name: mlops-pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 3.DEPLOYMENT
  AWS_REGION:      ${{ vars.AWS_REGION      || 'ap-south-2' }}
  AWS_ACCOUNT_ID:  ${{ vars.AWS_ACCOUNT_ID  || '117211782845' }}
  ECR_REPO:        ${{ vars.ECR_REPO        || 'qcomm-rfm-api' }}
  EKS_CLUSTER:     ${{ vars.EKS_CLUSTER     || 'qcomm-rfm-cluster' }}
  K8S_NAMESPACE:   ${{ vars.K8S_NAMESPACE   || 'prod' }}
  SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT || 'qcomm-rfm-sa' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"
      - name: pytest
        working-directory: 3.DEPLOYMENT
        run: pytest tests/ -q --tb=short
      - name: verify committed test fixtures
        run: |
          test -f "$PROJECT_DIR/tests/fixtures/sample_customers.csv"
          test -f "$PROJECT_DIR/tests/fixtures/fixture_model.pkl"

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: derive immutable image reference
        id: meta
        run: |
          REG="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "image=${REG}/${{ env.ECR_REPO }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ./3.DEPLOYMENT
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: container smoke check
        run: |
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.image }}" -ceu '
            test -x /app/entrypoint.sh
            test "$(stat -c "%a" /app/entrypoint.sh)" = "555"
            test "$(id -u appuser)" = "10001"
          '
      - name: record image digest
        run: |
          echo "tag: ${{ steps.meta.outputs.image }}"
          echo "digest: ${{ steps.push.outputs.digest }}"
      - name: security scan (report, do not block)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: pre-flight toolchain
        run: |
          for c in kubectl envsubst aws; do command -v "$c" >/dev/null || exit 1; done
          python3 -c "import yaml" || pip install pyyaml
      - name: verify AWS identity
        run: aws sts get-caller-identity
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: pre-flight cluster and IRSA
        run: |
          kubectl get ns "$K8S_NAMESPACE" >/dev/null
          kubectl -n "$K8S_NAMESPACE" get sa "$SERVICE_ACCOUNT" >/dev/null
      - name: render and apply
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          bash .github/scripts/render_and_verify.sh "$PROJECT_DIR/k8s" rendered
          kubectl apply -n "$K8S_NAMESPACE" -f rendered/
      - name: wait for rollout
        id: rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status deploy/qcomm-rfm-api --timeout=300s
      - name: rollout diagnostics on failure
        if: failure() && steps.rollout.conclusion == 'failure'
        run: |
          set +e
          kubectl -n "$K8S_NAMESPACE" describe deploy/qcomm-rfm-api
          kubectl -n "$K8S_NAMESPACE" get rs,pods -l app=qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" describe pods -l app=qcomm-rfm-api
          kubectl -n "$K8S_NAMESPACE" get events --sort-by='.lastTimestamp' | tail -100
          for pod in $(kubectl -n "$K8S_NAMESPACE" get pods -l app=qcomm-rfm-api -o name); do
            kubectl -n "$K8S_NAMESPACE" logs "$pod" -c api --tail=200
            kubectl -n "$K8S_NAMESPACE" logs "$pod" -c api --previous --tail=200
          done
          exit 1
      - name: report running deployment
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods -l app=qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" get svc qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" get deploy qcomm-rfm-api -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

  golden:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: verify AWS identity
        run: aws sts get-caller-identity
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: smoke test the deployed API through Kubernetes
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/qcomm-rfm-api --timeout=120s
          kubectl -n "$K8S_NAMESPACE" wait --for=condition=ready pod -l app=qcomm-rfm-api --timeout=120s
          kubectl -n "$K8S_NAMESPACE" get svc qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" port-forward svc/qcomm-rfm-api 18000:80 > /tmp/qcomm-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health >/tmp/qcomm-health.json; then
              cat /tmp/qcomm-health.json
              break
            fi
            if ! kill -0 "$PF_PID" 2>/dev/null; then
              cat /tmp/qcomm-port-forward.log || true
              echo 'FATAL: kubectl port-forward exited unexpectedly'
              exit 1
            fi
            sleep 2
          done
          test -s /tmp/qcomm-health.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 http://127.0.0.1:18000/health
          if [ -f "$PROJECT_DIR/tests/golden/expected.json" ]; then
            python "$PROJECT_DIR/tests/golden/check_live.py" --endpoint http://127.0.0.1:18000
          else
            echo 'tests/golden/expected.json absent — health smoke test passed; golden payload comparison skipped.'
          fi
