name: mlops-pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Root-controlled AWS account model:
# - AWS account/infrastructure is owned and controlled from the AWS root account.
# - GitHub Actions does NOT use AWS OIDC/IAM-role federation.
# - GitHub Actions uses a dedicated IAM access key stored in GitHub Actions Secrets.
# - NEVER store AWS root access keys in GitHub or in this repository.
#
# Required GitHub Actions secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# Optional (only if using temporary credentials):
#   AWS_SESSION_TOKEN
#
# The IAM user behind these keys must have only the permissions required for this
# project's ECR/EKS/S3 operations. The AWS root account is used by the owner to
# create/manage that user and the infrastructure; root credentials never enter CI.

env:
  PROJECT_DIR: 3.DEPLOYMENT
  AWS_REGION:      ${{ vars.AWS_REGION      || 'ap-south-2' }}
  AWS_ACCOUNT_ID:  ${{ vars.AWS_ACCOUNT_ID  || '117211782845' }}
  ECR_REPO:        ${{ vars.ECR_REPO        || 'qcomm-rfm-api' }}
  EKS_CLUSTER:     ${{ vars.EKS_CLUSTER     || 'qcomm-rfm-cluster' }}
  K8S_NAMESPACE:   ${{ vars.K8S_NAMESPACE   || 'prod' }}
  SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT || 'qcomm-rfm-sa' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ 1. TEST
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"

      # The test job deliberately has NO AWS credentials.
      - name: pytest (no AWS credentials configured)
        working-directory: 3.DEPLOYMENT
        run: pytest tests/ -q --tb=short

      - name: verify the fixture is committed, not gitignored
        run: |
          test -f "$PROJECT_DIR/tests/fixtures/sample_customers.csv" || { echo "fixture missing — a data/*.csv ignore rule probably ate it"; exit 1; }
          test -f "$PROJECT_DIR/tests/fixtures/fixture_model.pkl"    || { echo "fixture model missing"; exit 1; }
          echo "fixture present"

  # ------------------------------------------------------------------ 2. BUILD
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Authenticate with the AWS account through GitHub Secrets.
      # The credentials must belong to a dedicated IAM deployment user created/managed
      # from the AWS root-controlled account. Root access keys must NEVER be used here.
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: derive image reference
        id: meta
        run: |
          REG="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SHA="${GITHUB_SHA::7}"
          echo "image=${REG}/${{ env.ECR_REPO }}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "registry=${REG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # SHA TAG ONLY. The ECR repo is immutable; never push :latest.
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ./3.DEPLOYMENT
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: record the image DIGEST
        run: |
          echo "tag:    ${{ steps.meta.outputs.image }}"
          echo "digest: ${{ steps.push.outputs.digest }}"
          echo "The digest identifies the exact image that was built."

      - name: security scan (report, do not block)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

  # ------------------------------------------------------------------ 3. DEPLOY
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: pre-flight the runner toolchain
        run: |
          for c in kubectl envsubst aws; do
            command -v "$c" >/dev/null || { echo "FATAL: $c not on the runner"; exit 1; }
          done
          "$(command -v python3 || command -v python)" -c "import yaml" \
            || pip install pyyaml
          echo "toolchain OK"

      - name: verify AWS identity
        run: aws sts get-caller-identity

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # CI verifies infrastructure; it does not create the cluster, namespace, or IRSA.
      - name: pre-flight cluster and IRSA
        run: |
          kubectl get ns "$K8S_NAMESPACE" >/dev/null || {
            echo "FATAL: namespace '$K8S_NAMESPACE' missing. Create it from the AWS-controlled infrastructure setup."; exit 1; }
          kubectl -n "$K8S_NAMESPACE" get sa "$SERVICE_ACCOUNT" >/dev/null || {
            echo "FATAL: ServiceAccount '$SERVICE_ACCOUNT' missing in '$K8S_NAMESPACE'."; exit 1; }
          echo "cluster + IRSA pre-flight OK"

      - name: render, verify, then apply
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          bash .github/scripts/render_and_verify.sh "$PROJECT_DIR/k8s" rendered
          kubectl apply -n "$K8S_NAMESPACE" -f rendered/

      - name: wait for rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status deploy/qcomm-rfm-api --timeout=300s

      - name: report what is actually running
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods -l app=qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" get deploy qcomm-rfm-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

  # ------------------------------------------------------------- 4. POST-DEPLOY
  golden:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: verify AWS identity
        run: aws sts get-caller-identity

      - name: resolve the load balancer
        id: lb
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          for i in $(seq 1 30); do
            HOST=$(kubectl -n "$K8S_NAMESPACE" get svc qcomm-rfm-api \
                   -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$HOST" ] && break
            echo "waiting for LB hostname ($i/30)"; sleep 10
          done
          [ -n "$HOST" ] || { echo "FATAL: no LB hostname after 5 minutes"; exit 1; }
          echo "endpoint=http://${HOST}" >> "$GITHUB_OUTPUT"

      - name: golden payload check against the live endpoint
        env:
          ENDPOINT: ${{ steps.lb.outputs.endpoint }}
        run: |
          if [ ! -f "$PROJECT_DIR/tests/golden/expected.json" ]; then
            echo "tests/golden/expected.json absent — skipping golden check."
            exit 0
          fi
          python "$PROJECT_DIR/tests/golden/check_live.py" --endpoint "$ENDPOINT"
