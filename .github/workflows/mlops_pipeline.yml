name: mlops-pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Zero-config: every non-secret identifier has a concrete default, so a fresh clone works
# without the user creating a single repo Variable. Composite values are DERIVED, not added
# as more variables.
# Phase 2 code lives in the 3.DEPLOYMENT/ subfolder; .github/ must sit at the repo ROOT
# because GitHub only reads workflows from there. Every path below is relative to the root.
env:
  PROJECT_DIR: 3.DEPLOYMENT
  AWS_REGION:     ${{ vars.AWS_REGION     || 'ap-south-2' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '117211782845' }}
  ECR_REPO:       ${{ vars.ECR_REPO       || 'qcomm-rfm-api' }}
  EKS_CLUSTER:    ${{ vars.EKS_CLUSTER    || 'qcomm-rfm-cluster' }}
  K8S_NAMESPACE:  ${{ vars.K8S_NAMESPACE  || 'prod' }}
  SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT || 'qcomm-rfm-sa' }}

permissions:
  contents: read
  id-token: write          # required for OIDC. No long-lived AWS key exists anywhere.

jobs:
  # ------------------------------------------------------------------ 1. TEST
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # CI installs requirements-dev.txt, which -r includes requirements.txt. Whatever
      # file CI installs from must contain everything the tests import.
      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"

      # THE TEST JOB HAS NO CLOUD CREDENTIALS AT ALL. Data resolves to the committed
      # fixture. This removes the entire class of "CI failed on NoSuchKey / missing
      # credentials / unset S3_BUCKET".
      - name: pytest (no AWS credentials configured)
        working-directory: 3.DEPLOYMENT
        run: pytest tests/ -q --tb=short

      - name: verify the fixture is committed, not gitignored
        run: |
          test -f "$PROJECT_DIR/tests/fixtures/sample_customers.csv" || { echo "fixture missing — a data/*.csv ignore rule probably ate it"; exit 1; }
          test -f "$PROJECT_DIR/tests/fixtures/fixture_model.pkl"    || { echo "fixture model missing"; exit 1; }
          echo "fixture present"

  # ------------------------------------------------------------------ 2. BUILD
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/qcomm-rfm-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: derive image reference
        id: meta
        run: |
          REG="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SHA="${GITHUB_SHA::7}"
          echo "image=${REG}/${{ env.ECR_REPO }}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "registry=${REG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # SHA TAG ONLY. The ECR repo is created with --image-tag-mutability IMMUTABLE
      # (runbook step 12), so re-pushing :latest would fail with
      # ImageTagAlreadyExistsException on the SECOND CI run and every run after it.
      # Immutability and a floating tag are mutually exclusive; immutability wins, because
      # it is what makes "deploy by SHA" a guarantee rather than a convention.
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ./3.DEPLOYMENT       # Dockerfile and src/ live here, not at the root
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: record the image DIGEST
        run: |
          echo "tag:    ${{ steps.meta.outputs.image }}"
          echo "digest: ${{ steps.push.outputs.digest }}"
          echo "The OS layer is not byte-reproducible (apt-get upgrade). The digest is"
          echo "what identifies a running image exactly."

      # trivy-action publishes NO floating major tag. @v0 and @0.36.0 both fail at
      # "Set up job", before any step runs. Verified 2026-09-09 via git ls-remote --tags.
      - name: security scan (report, do not block)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true          # Trivy pulls its DB from ghcr.io, which rate-limits
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true           # unpatchable base-image CVEs must not block forever
          exit-code: '0'                 # REPORT mode. Findings are read in the sign-off.
          format: table

  # ------------------------------------------------------------------ 3. DEPLOY
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/qcomm-rfm-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: pre-flight the runner toolchain
        run: |
          for c in kubectl envsubst aws; do
            command -v "$c" >/dev/null || { echo "FATAL: $c not on the runner"; exit 1; }
          done
          "$(command -v python3 || command -v python)" -c "import yaml" \
            || pip install pyyaml
          echo "toolchain OK"

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # CI VERIFIES infrastructure. CI never creates it. The cluster, the OIDC provider
      # and the IRSA ServiceAccount are one-time human steps.
      - name: pre-flight cluster and IRSA
        run: |
          kubectl get ns "$K8S_NAMESPACE" >/dev/null || {
            echo "FATAL: namespace '$K8S_NAMESPACE' missing. Runbook step 16 creates it."; exit 1; }
          kubectl -n "$K8S_NAMESPACE" get sa "$SERVICE_ACCOUNT" >/dev/null || {
            echo "FATAL: ServiceAccount '$SERVICE_ACCOUNT' missing in '$K8S_NAMESPACE'."
            echo "Runbook step 16 creates it via eksctl create iamserviceaccount."
            echo "Without it, pods sit in ContainerCreating with no CI signal."; exit 1; }
          echo "cluster + IRSA pre-flight OK"

      - name: render, verify, then apply
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          bash .github/scripts/render_and_verify.sh "$PROJECT_DIR/k8s" rendered
          kubectl apply -n "$K8S_NAMESPACE" -f rendered/

      - name: wait for rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status deploy/qcomm-rfm-api --timeout=300s

      - name: report what is actually running
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods -l app=qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" get deploy qcomm-rfm-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

  # ------------------------------------------------------------- 4. POST-DEPLOY
  golden:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/qcomm-rfm-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: resolve the load balancer
        id: lb
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          for i in $(seq 1 30); do
            HOST=$(kubectl -n "$K8S_NAMESPACE" get svc qcomm-rfm-api \
                   -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$HOST" ] && break
            echo "waiting for LB hostname ($i/30)"; sleep 10
          done
          [ -n "$HOST" ] || { echo "FATAL: no LB hostname after 5 minutes"; exit 1; }
          echo "endpoint=http://${HOST}" >> "$GITHUB_OUTPUT"

      # Golden expectations are recorded against the REAL promoted artifact by runbook
      # step 16, never against a fixture-trained stand-in. If the file is absent this
      # step says so and skips, rather than failing every run on a bogus comparison.
      - name: golden payload check against the live endpoint
        env:
          ENDPOINT: ${{ steps.lb.outputs.endpoint }}
        run: |
          if [ ! -f "$PROJECT_DIR/tests/golden/expected.json" ]; then
            echo "tests/golden/expected.json absent — recorded by runbook step 8."
            echo "Skipping. See tests/golden/README.md."
            exit 0
          fi
          python "$PROJECT_DIR/tests/golden/check_live.py" --endpoint "$ENDPOINT"
