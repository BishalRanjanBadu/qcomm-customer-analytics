name: mlops-pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# AWS account/infrastructure is owner-controlled. CI authenticates with GitHub Secrets
# belonging to a dedicated IAM deployment principal. NEVER use AWS root access keys here.
# Required secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Optional: AWS_SESSION_TOKEN (only for temporary credentials)

env:
  PROJECT_DIR: 3.DEPLOYMENT
  AWS_REGION:      ${{ vars.AWS_REGION      || 'ap-south-2' }}
  AWS_ACCOUNT_ID:  ${{ vars.AWS_ACCOUNT_ID  || '117211782845' }}
  ECR_REPO:        ${{ vars.ECR_REPO        || 'qcomm-rfm-api' }}
  EKS_CLUSTER:     ${{ vars.EKS_CLUSTER     || 'qcomm-rfm-cluster' }}
  K8S_NAMESPACE:   ${{ vars.K8S_NAMESPACE   || 'prod' }}
  SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT || 'qcomm-rfm-sa' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"
      # Deliberately no AWS credentials in the test job.
      - name: pytest (no AWS credentials configured)
        working-directory: 3.DEPLOYMENT
        run: pytest tests/ -q --tb=short
      - name: verify the fixture is committed, not gitignored
        run: |
          test -f "$PROJECT_DIR/tests/fixtures/sample_customers.csv" || { echo "fixture missing"; exit 1; }
          test -f "$PROJECT_DIR/tests/fixtures/fixture_model.pkl" || { echo "fixture model missing"; exit 1; }

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: derive image reference
        id: meta
        run: |
          REG="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SHA="${GITHUB_SHA::7}"
          echo "image=${REG}/${{ env.ECR_REPO }}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "registry=${REG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ./3.DEPLOYMENT
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Catch the exact class of bug that previously reached EKS: Git stores shell
      # scripts as 0644 here, while exec-form ENTRYPOINT requires the file to be executable.
      - name: container smoke check
        run: |
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.image }}" -ceu '
            test -x /app/entrypoint.sh
            test "$(stat -c "%a" /app/entrypoint.sh)" = "555"
            test "$(id -u appuser 2>/dev/null || true)" = "10001"
            test "${HOME:-}" = "/root" || true
          '
          echo "container filesystem/entrypoint checks passed"
      - name: record the image DIGEST
        run: |
          echo "tag:    ${{ steps.meta.outputs.image }}"
          echo "digest: ${{ steps.push.outputs.digest }}"
      - name: security scan (report, do not block)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: pre-flight the runner toolchain
        run: |
          for c in kubectl envsubst aws; do
            command -v "$c" >/dev/null || { echo "FATAL: $c not on the runner"; exit 1; }
          done
          python3 -c "import yaml" || pip install pyyaml
      - name: verify AWS identity
        run: aws sts get-caller-identity
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: pre-flight cluster and IRSA
        run: |
          kubectl get ns "$K8S_NAMESPACE" >/dev/null || { echo "FATAL: namespace '$K8S_NAMESPACE' missing"; exit 1; }
          kubectl -n "$K8S_NAMESPACE" get sa "$SERVICE_ACCOUNT" >/dev/null || { echo "FATAL: ServiceAccount '$SERVICE_ACCOUNT' missing"; exit 1; }
      - name: render, verify, then apply
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          bash .github/scripts/render_and_verify.sh "$PROJECT_DIR/k8s" rendered
          kubectl apply -n "$K8S_NAMESPACE" -f rendered/
      - name: wait for rollout
        id: rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status deploy/qcomm-rfm-api --timeout=300s
      - name: rollout diagnostics on failure
        if: failure() && steps.rollout.conclusion == 'failure'
        run: |
          set +e
          echo '=== DEPLOYMENT ==='
          kubectl -n "$K8S_NAMESPACE" get deployment qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" describe deployment qcomm-rfm-api
          echo '=== REPLICASETS ==='
          kubectl -n "$K8S_NAMESPACE" get rs -l app=qcomm-rfm-api -o wide
          echo '=== PODS ==='
          kubectl -n "$K8S_NAMESPACE" get pods -l app=qcomm-rfm-api -o wide
          echo '=== POD DETAILS ==='
          for pod in $(kubectl -n "$K8S_NAMESPACE" get pods -l app=qcomm-rfm-api -o name); do
            echo "--- $pod ---"
            kubectl -n "$K8S_NAMESPACE" describe "$pod"
            echo '--- current logs ---'
            kubectl -n "$K8S_NAMESPACE" logs "$pod" -c api --tail=200
            echo '--- previous logs ---'
            kubectl -n "$K8S_NAMESPACE" logs "$pod" -c api --previous --tail=200
          done
          echo '=== RECENT EVENTS ==='
          kubectl -n "$K8S_NAMESPACE" get events --sort-by='.lastTimestamp' | tail -100
          echo '=== ROLLOUT HISTORY ==='
          kubectl -n "$K8S_NAMESPACE" rollout history deploy/qcomm-rfm-api
          exit 1
      - name: report what is actually running
        if: success()
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods -l app=qcomm-rfm-api -o wide
          kubectl -n "$K8S_NAMESPACE" get deploy qcomm-rfm-api -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

  golden:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: pip install -r "$PROJECT_DIR/requirements-dev.txt"
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: verify AWS identity
        run: aws sts get-caller-identity
      - name: resolve the load balancer
        id: lb
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          for i in $(seq 1 30); do
            HOST=$(kubectl -n "$K8S_NAMESPACE" get svc qcomm-rfm-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$HOST" ] && break
            echo "waiting for LB hostname ($i/30)"; sleep 10
          done
          [ -n "$HOST" ] || { echo "FATAL: no LB hostname after 5 minutes"; exit 1; }
          echo "endpoint=http://${HOST}" >> "$GITHUB_OUTPUT"
      - name: golden payload check against the live endpoint
        env:
          ENDPOINT: ${{ steps.lb.outputs.endpoint }}
        run: |
          if [ ! -f "$PROJECT_DIR/tests/golden/expected.json" ]; then
            echo "tests/golden/expected.json absent — skipping golden check."
            exit 0
          fi
          python "$PROJECT_DIR/tests/golden/check_live.py" --endpoint "$ENDPOINT"
