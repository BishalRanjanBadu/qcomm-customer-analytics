# Slim deployment: 1 replica, API only, sized for a single t3.medium.
# The canary manifests in k8s/canary/ are correct and DEFERRED — canary needs >=2 pods
# and one t3.medium cannot host them with headroom. Documented deviation, not a waiver.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qcomm-rfm-api
  namespace: prod
  labels: {app: qcomm-rfm-api, track: stable}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: qcomm-rfm-api, track: stable}
  strategy:
    # Single-pod / single-node production footprint: allow the old pod to terminate
    # before scheduling the replacement. This avoids a rollout deadlock when the node
    # cannot temporarily fit two API pods.
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  template:
    metadata:
      labels: {app: qcomm-rfm-api, track: stable}
    spec:
      serviceAccountName: qcomm-rfm-sa
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          envFrom: [{configMapRef: {name: qcomm-rfm-config}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/appuser}
          resources:
            requests: {cpu: "250m", memory: "768Mi"}
            limits:   {cpu: "1000m", memory: "1536Mi"}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /live, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "10"]}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: home, emptyDir: {}}
