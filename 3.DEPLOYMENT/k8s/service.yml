apiVersion: v1
kind: Service
metadata:
  name: qcomm-rfm-api
  namespace: prod
  # Use the EKS-managed Service LoadBalancer path. The previous `external` / NLB-IP
  # annotations require the AWS Load Balancer Controller to be installed in-cluster;
  # this cluster does not provision that controller, so the Service stayed Pending.
  # A plain LoadBalancer is handled by the EKS cloud provider without an extra controller.
spec:
  type: LoadBalancer
  selector: {app: qcomm-rfm-api, track: stable}
  ports:
    - {name: http, port: 80, targetPort: 8000, protocol: TCP}
